
name: Update ESP32 Blocklist

on:
  schedule:
    - cron: "0 20 */3 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blocklist
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build blocklist.bin
        run: |
          python tools/build_blocklist.py blocklist.bin

      - name: Validate binary
        run: |
          test -s blocklist.bin

          SIZE=$(stat -c%s blocklist.bin)

          if [ $((SIZE % 5)) -ne 0 ]; then
            echo "Invalid blocklist size: not divisible by 5"
            exit 1
          fi

          echo "Blocklist size: $SIZE bytes"
          sha256sum blocklist.bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Automatically generated ESP32 blocklist."
          NOTES="$NOTES\nSources: HaGeZi Multi Pro + TIF Medium."
          NOTES="$NOTES\nUpdated: $(date -u '+%Y-%m-%d %H:%M UTC')"

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest blocklist.bin --clobber
            gh release edit latest \
              --title "ESP32 AdBlock - Latest Blocklist" \
              --notes "$NOTES"
          else
            gh release create latest blocklist.bin \
              --title "ESP32 AdBlock - Latest Blocklist" \
              --notes "$NOTES"
          fi
